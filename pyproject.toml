[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "psx-ml-research"
version = "0.1.0"
description = "Leakage-safe PSX research data foundation"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "pyarrow>=16,<22"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ml = ["torch>=2.8"]
models = ["scikit-learn>=1.5,<2"]
trees = ["scikit-learn>=1.5,<2", "lightgbm>=4.5,<5", "xgboost>=3,<4"]

[project.scripts]
psx-c1 = "psx_ml.cli:main"
psx-ml-env-report = "psx_ml.runtime.diagnostics:main"
psx-c3-features = "psx_ml.features.pipeline:main"
psx-c4-dataset = "psx_ml.targets.pipeline:main"
psx-c5-linear = "psx_ml.models.pipeline:main"
psx-c6-universe = "psx_ml.instruments.pipeline:main"
psx-security-master = "psx_ml.instruments.security_master:main"
psx-c7-trees = "psx_ml.tree_models.pipeline:main"
psx-c8-context = "psx_ml.c8.pipeline:main"
psx-live-production-ticket = "psx_ml.live.production_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: requires a working CUDA-capable PyTorch runtime"]
