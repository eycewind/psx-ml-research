[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "psx-ml-research"
version = "0.1.0"
description = "Leakage-safe PSX research data foundation"
requires-python = ">=3.11"
dependencies = ["pyarrow>=16,<22"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
psx-c1 = "psx_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
