[input]
targets_path = "data/processed/targets/daily_feature_targets.parquet"
universe_path = "data/processed/universe/c6_universe_membership.parquet"
split_path = "data/processed/datasets/temporal_split_assignments.parquet"
security_master_path = "data/reference/psx_security_master_2026-08-01.parquet"
c3_manifest_path = "artifacts/reports/C3_FEATURE_MANIFEST.json"
c4_manifest_path = "artifacts/reports/C4_TARGET_SPLIT_MANIFEST.json"
c6_manifest_path = "artifacts/reports/C6_MANIFEST.json"
c7_manifest_path = "artifacts/reports/C7_MODEL_MANIFEST.json"

[target]
horizons = [5, 10, 20]
minimum_market_peers = 1
minimum_sector_peers = 5
relaxed_sector_peers = 3
shrinkage_strength = 5.0
shrinkage_rule = "w = valid_peer_count / (valid_peer_count + 5)"
sector_minimum_policy = "peers_after_leave_one_out"
rank_tie_break = "relative_return_then_symbol"

[output]
relative_targets_path = "data/processed/targets/c8_relative_targets.parquet"
target_report_path = "artifacts/reports/C8_TARGET_REPORT.md"
manifest_path = "artifacts/reports/C8_MANIFEST.json"
sector_audit_path = "data/processed/diagnostics/c8_sector_target_exclusions.parquet"
sector_coverage_path = "data/processed/diagnostics/c8_sector_target_coverage.parquet"
sector_coverage_report_path = "artifacts/reports/C8_SECTOR_COVERAGE_REPORT.md"
sector_sensitivity_path = "data/processed/diagnostics/c8_sector_threshold_sensitivity.parquet"
sector_sensitivity_coverage_path = "data/processed/diagnostics/c8_sector_threshold_coverage.parquet"
market_features_path = "data/processed/features/c8_market_context_features.parquet"
sector_features_path = "data/processed/features/c8_sector_context_features.parquet"
relative_features_path = "data/processed/features/c8_relative_features.parquet"
feature_missingness_path = "data/processed/diagnostics/c8_feature_missingness_by_fold.parquet"
feature_report_path = "artifacts/reports/C8_FEATURE_REPORT.md"
